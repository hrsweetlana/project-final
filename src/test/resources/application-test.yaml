spring.cache.type: none
spring:
  main:
    allow-circular-references: true
  liquibase:
    enabled: false
    change-log: classpath:db/changelog.sql
  h2:
    console:
      enabled: true
  datasource:
    generate-unique-name: false
    url: jdbc:h2:mem:h2-jira;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;CASE_INSENSITIVE_IDENTIFIERS=FALSE;NON_KEYWORDS=VALUE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    defer-datasource-initialization: true # відкласти Hibernate, щоб не обігнав data.sql
    hibernate:
      ddl-auto: none   
    properties:
      hibernate:
        hbm2ddl:
          auto: none
  mail:
    username: hrsvitlana@gmail.com
  logging:
    level:
      liquibase: TRACE
      org.springframework.jdbc.datasource.init: DEBUG